<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>VentureWeavers Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: fixed ink sidebar (228px) + sticky top bar + scrolling workspace. Same shell for member app and admin console. */
:root{
  --bg:#F3F8F5; --card:#FFFFFF; --fg:#071112; --muted:#3E4E4C; --faint:#55655F; --line:#DFE8E3; --line2:#CCDAD3; --hover:#EEF4F1;
  --soft:#DCF1DD; --soft-fg:#02686F; --primary:#02686F; --on-primary:#FFFFFF; --link:#02686F;
  --ink:#071112; --ink2:#12302F; --ink-line:#1E3233; --ink-fg:#DCF1DD; --ink-muted:#A9C9C1; --teal:#29BE9C;
  --out-bg:#FBEBD3; --out-fg:#7A4700; --out:#E39B2D;
  --tvs-bg:#DFE7F6; --tvs-fg:#1C3F86; --tvs:#1F4FA3;
  --brk-bg:#F6E3DC; --brk-fg:#8A3A1E; --brk:#B5532F;
  --qq-bg:#EAF4D2; --qq-fg:#3F5A0A; --qq:#8DBF2E;
  --house-bg:#DCF1DD; --house-fg:#02686F;
  --warn-bg:#FBEBD3; --warn-fg:#7A4700; --bad-bg:#F8E1DE; --bad-fg:#9A2B1E;
  --shadow:0 1px 2px rgba(7,17,18,.05);
  --display:'Chakra Petch','Arial Narrow',Arial,sans-serif; --text:'Nunito Sans',Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1617; --card:#0F2122; --fg:#E4F1EC; --muted:#B4CBC5; --faint:#9DB8B1; --line:#1F3536; --line2:#2C4747; --hover:#142B2C;
  --soft:#14302E; --soft-fg:#7FE0C4; --primary:#1E8C86; --on-primary:#FFFFFF; --link:#5FD6B8;
  --ink:#050C0D; --ink2:#12302F; --ink-line:#1A2E2F;
  --out-bg:#3A2A10; --out-fg:#F2C27A; --tvs-bg:#16264A; --tvs-fg:#B9CCF4; --brk-bg:#3B1E14; --brk-fg:#F0B49A; --qq-bg:#26330D; --qq-fg:#C8E68A; --house-bg:#14302E; --house-fg:#7FE0C4;
  --warn-bg:#3A2A10; --warn-fg:#F2C27A; --bad-bg:#3D1A16; --bad-fg:#F2A99E; --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A1617; --card:#0F2122; --fg:#E4F1EC; --muted:#B4CBC5; --faint:#9DB8B1; --line:#1F3536; --line2:#2C4747; --hover:#142B2C;
  --soft:#14302E; --soft-fg:#7FE0C4; --primary:#1E8C86; --on-primary:#FFFFFF; --link:#5FD6B8;
  --ink:#050C0D; --ink2:#12302F; --ink-line:#1A2E2F;
  --out-bg:#3A2A10; --out-fg:#F2C27A; --tvs-bg:#16264A; --tvs-fg:#B9CCF4; --brk-bg:#3B1E14; --brk-fg:#F0B49A; --qq-bg:#26330D; --qq-fg:#C8E68A; --house-bg:#14302E; --house-fg:#7FE0C4;
  --warn-bg:#3A2A10; --warn-fg:#F2C27A; --bad-bg:#3D1A16; --bad-fg:#F2A99E; --shadow:none; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--card)}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
h1{font-family:var(--display);font-weight:600;font-size:22px}
h2{font-size:15px;font-weight:800}
h3{font-size:14.5px;font-weight:800}
p{margin:0}
.muted{color:var(--muted)} .faint{color:var(--faint);font-size:12.5px} .num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.side{position:fixed;top:0;bottom:0;left:0;width:228px;background:var(--ink);color:var(--ink-fg);padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:1px;overflow:hidden;z-index:50}
.side .logo{width:164px;height:auto;margin:2px 8px 18px}
.side .lbl{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#7FA49B;padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-fg);text-decoration:none!important;flex:0 0 auto}
.nav svg{flex:0 0 18px;opacity:.85}
.nav:hover{background:var(--ink2);color:#FFFFFF}
.nav[aria-current="page"]{background:var(--ink2);color:var(--teal)}
.nav .dot{margin-left:auto}
.nav .count{margin-left:auto;font-size:11px;font-weight:800;background:var(--teal);color:#071112;border-radius:9px;padding:0 6px;line-height:18px}
.side hr{border:0;height:1px;background:var(--ink-line);margin:10px 4px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--ink-line)}
.hosts{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-muted);padding:0 6px}
.av{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid var(--ink)}
.av+.av{margin-left:-10px}
.seg{display:flex;background:var(--ink2);border-radius:8px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink-muted);font-weight:700;font-size:12px;height:28px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);color:#071112}
.proto{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#7FA49B;padding:0 6px}
.proto button{background:none;border:0;color:var(--ink-muted);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline;padding:4px 0}
.main{margin-left:228px;min-height:100vh;display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:56px;display:flex;align-items:center;gap:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:1px solid var(--line)}
.iconbtn.menu-btn{display:none}
.top .crumb{font-size:13px;color:var(--faint);font-weight:700;white-space:nowrap}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--faint)}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:13.5px;min-width:0;color:var(--fg)}
.top .sp{flex:1}
.iconbtn{position:relative;width:36px;height:36px;border-radius:8px;border:1px solid var(--line2);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 36px;color:var(--fg)}
.iconbtn:hover{background:var(--hover)}
.iconbtn .badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--teal);color:#071112;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--card)}
.me{display:flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none!important}
.initials{width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:13px;flex:0 0 32px}
.me .who{display:flex;flex-direction:column;line-height:1.2}
.me .who b{font-size:13px} .me .who span{font-size:11.5px;color:var(--faint)}
.notifs{position:absolute;right:16px;top:52px;width:min(340px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(7,17,18,.16);padding:8px;display:flex;flex-direction:column;gap:2px}
.notifs .n{padding:8px 10px;border-radius:8px;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.notifs .n.unread{background:var(--soft)}
.content{width:100%;max-width:1240px;margin:0 auto;padding-block:22px 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.pagehead .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.pagehead p{color:var(--muted);font-size:13.5px;max-width:640px}
.pagehead .acts{display:flex;gap:8px;flex-wrap:wrap}
.tabbar,.scrim{display:none}

@media (max-width:900px){
  .side{transform:translateX(-100%);transition:transform .2s ease;overflow-y:auto;box-shadow:none;width:260px}
  .nav-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(7,17,18,.45);z-index:49}
  .main{margin-left:0}
  .iconbtn.menu-btn{display:inline-flex}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:8px}
  .top .crumb,.me .who{display:none}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px;gap:14px}
  .member .content{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));z-index:40}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;justify-content:center;text-decoration:none!important;font-size:10.5px;font-weight:700;color:var(--faint);background:none;border:0;cursor:pointer}
  .tabbar [aria-current="page"]{color:var(--link)}
  .btn{min-height:40px}
  .chip{min-height:36px}
  h1{font-size:20px}
}
@media (max-height:640px) and (min-width:901px){ .side .logo{margin-bottom:10px} .nav{height:32px} .side .lbl{padding-top:8px} .hosts{display:none} }

/* ---------- components ---------- */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:76px}
@media (max-width:1080px){.grid2{grid-template-columns:minmax(0,1fr)} .rail{position:static}}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cards.sm{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow)}
.card.pad0{padding:0;overflow:hidden}
.card.soft{background:var(--soft);border-color:transparent}
.card.ink{background:var(--ink);border-color:var(--ink-line);color:var(--ink-fg)}
.card.ink h2,.card.ink h3{color:#FFFFFF} .card.ink .muted,.card.ink .faint{color:var(--ink-muted)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-h a,.card-h button.link{font-size:12.5px;font-weight:700}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.tag{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.tag.Outloud{background:var(--out-bg);color:var(--out-fg)} .tag.TVS{background:var(--tvs-bg);color:var(--tvs-fg)}
.tag.BRICKR{background:var(--brk-bg);color:var(--brk-fg)} .tag.QuidQuo{background:var(--qq-bg);color:var(--qq-fg)}
.tag.House{background:var(--house-bg);color:var(--house-fg)}
.tag.plain{background:var(--bg);border:1px solid var(--line2);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 7px}
.d-Outloud{background:var(--out)} .d-TVS{background:var(--tvs)} .d-BRICKR{background:var(--brk)} .d-QuidQuo{background:var(--qq)} .d-House{background:var(--teal)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:700;white-space:nowrap;border:0;cursor:default}
button.pill{cursor:pointer}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--soft);color:var(--soft-fg)} .pill.draft{background:var(--hover);color:var(--faint)} .pill.warn{background:var(--warn-bg);color:var(--warn-fg)} .pill.blue{background:var(--tvs-bg);color:var(--tvs-fg)} .pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;min-height:34px;padding:0 14px;border-radius:8px;border:1px solid transparent;background:var(--primary);color:var(--on-primary);font-weight:700;font-size:13.5px;text-decoration:none!important;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--card);border-color:var(--line2);color:var(--fg)} .btn.sec:hover{background:var(--hover);filter:none}
.btn.ghost{background:transparent;color:var(--link);padding:0 8px} .btn.ghost:hover{background:var(--hover);filter:none}
.btn.teal{background:var(--teal);color:#071112}
.btn.danger{background:var(--bad-bg);color:var(--bad-fg)}
.btn.sm{height:28px;min-height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.lg{height:42px;min-height:42px;padding:0 18px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;min-height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line2);background:var(--card);font-weight:700;font-size:12.5px;cursor:pointer;color:var(--fg)}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{height:38px;padding:0 12px;border:0;background:transparent;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--faint);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--teal)}
.tabs .n{font-size:11px;background:var(--hover);border-radius:8px;padding:1px 6px;margin-left:4px;color:var(--faint)}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field textarea,.field select,.input{height:36px;border-radius:8px;border:1px solid var(--line2);padding:0 10px;font-weight:400;font-size:13.5px;background:var(--card);color:var(--fg);width:100%}
.field textarea,textarea.input{height:auto;padding:8px 10px;resize:vertical;line-height:1.45}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card);text-align:left;cursor:pointer;width:100%;font-size:13.5px}
.opt .ring{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);flex:0 0 16px}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--soft)}
.opt[aria-pressed="true"] .ring{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 2px var(--soft)}
.opt .sub{display:block;font-size:12px;color:var(--faint);font-weight:400}
.check{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;accent-color:var(--primary);flex:0 0 18px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:3px}
.datebox{flex:0 0 46px;height:50px;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.datebox small{font-size:10px;font-weight:800;color:var(--link);letter-spacing:.5px} .datebox b{font-family:var(--display);font-size:18px;color:var(--fg)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .title{font-weight:700;font-size:14px;color:var(--fg)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb{flex:0 0 112px;height:80px;border-radius:9px;overflow:hidden;background:var(--ink);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.icon{display:flex;align-items:center;justify-content:center}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv>div{background:var(--bg);border-radius:8px;padding:8px 10px}
.kv small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--faint);text-transform:uppercase}
.kv b{font-size:13.5px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps li{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700}
.steps li span{height:4px;border-radius:2px;background:var(--line)}
.steps li.on span{background:var(--primary)}
.steps li:not(.on){color:var(--faint);font-weight:600}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:24px;color:var(--faint);text-align:center;font-size:13.5px}
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:680px}
th{text-align:left;font-size:11px;letter-spacing:.8px;color:var(--faint);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--line);text-transform:uppercase;background:var(--bg);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--hover)} tr.sel td{background:var(--soft)}
td .sub{display:block;font-size:12px;color:var(--faint)}
.minibar{display:flex;align-items:center;gap:8px;min-width:120px}
.minibar .bar{flex:1}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .search{background:var(--card);max-width:320px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px}
.kpi small{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--faint);text-transform:uppercase}
.kpi b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--hover);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:220px}
.col header{display:flex;justify-content:space-between;font-weight:800;font-size:12.5px;padding:2px 4px;color:var(--muted)}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:13.5px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
@media (max-width:900px){.toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
.overlay{position:fixed;inset:0;background:rgba(7,17,18,.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--card);color:var(--fg);border-radius:14px;width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column}
.dialog .head{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dialog .head img{width:56px;height:56px;border-radius:9px;object-fit:cover}
.dialog .body{padding:16px;display:flex;flex-direction:column;gap:12px}
.dialog .foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.drawer-wrap{position:fixed;inset:0;z-index:70;background:rgba(7,17,18,.45);display:flex;justify-content:flex-end}
.drawer{width:min(460px,100%);height:100%;background:var(--card);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.drawer .head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;border-bottom:1px solid var(--line)}
.drawer .body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.drawer .foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:16px;font-weight:800;cursor:pointer;color:var(--fg)}
.qr{background:#FFFFFF;padding:10px;border-radius:10px;display:inline-flex}
.live{background:var(--ink);color:var(--ink-fg);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.live h2{color:#FFFFFF}
.livepill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;background:var(--teal);color:#071112;font-size:11px;font-weight:800;letter-spacing:1px}
.livepill i{width:7px;height:7px;border-radius:50%;background:#071112;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.livepill i{animation:none}.side{transition:none}}
.q{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--ink-line);font-size:13.5px}
.q .t{flex:1}
.vote{flex:0 0 46px;height:44px;border-radius:9px;border:1px solid #3A5A57;background:transparent;color:var(--ink-fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:12px;line-height:1.1}
.vote[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#071112}
.pollopt{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;height:42px;padding:0 12px;border-radius:9px;background:var(--ink2);border:1px solid var(--ink-line);color:#FFFFFF;font-weight:700;font-size:13.5px;cursor:pointer;width:100%;text-align:left}
.pollopt .fill{position:absolute;left:0;top:0;bottom:0;background:#1F5A52}
.pollopt span{position:relative}
.pollopt[aria-pressed="true"]{border-color:var(--teal)}
.join{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.joinbox{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
.tile{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;gap:4px;text-decoration:none!important;color:#FFFFFF;background:#02686F}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.tile>*{position:relative}
.tile b{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2}
.tile small{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.tile .plat{position:absolute;top:12px;left:12px;font-size:11px;font-weight:700;background:rgba(7,17,18,.65);padding:3px 8px;border-radius:6px}
.module{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 10px;border-radius:9px;border:1px solid transparent;background:transparent;text-align:left;cursor:pointer;width:100%;font-size:13px;color:var(--fg)}
.module:hover{background:var(--hover)}
.module[aria-current="true"]{background:var(--card);border-color:var(--tvs)}
.module .m{flex:0 0 24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11.5px;background:var(--line)}
.module.done .m{background:var(--teal);color:#071112}
.module[disabled]{opacity:.55;cursor:not-allowed}
.task{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bg);cursor:pointer;border:1px solid var(--line);width:100%;text-align:left;font-size:13.5px;color:var(--fg)}
.task .box{flex:0 0 20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center}
.task[aria-pressed="true"] .box{background:var(--teal);border-color:var(--teal);color:#071112}
.task[aria-pressed="true"] .tt{color:var(--faint);text-decoration:line-through}
.msg{padding:10px;border-radius:9px;background:var(--bg);display:flex;flex-direction:column;gap:2px;font-size:13px}
.msg.host{background:var(--soft)}
.scanner{height:170px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center;position:relative}
.scanner span{width:110px;height:110px;border:3px solid var(--teal);border-radius:14px}
.scanner small{position:absolute;bottom:8px;color:var(--ink-muted);font-weight:700;font-size:12px}
.moments{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.moments button{height:38px;border-radius:8px;border:0;background:var(--ink2);color:var(--ink-muted);font-weight:700;font-size:12.5px;cursor:pointer;text-align:left;padding:0 10px}
.moments button[aria-pressed="true"]{background:var(--teal);color:#071112}
.vbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end;height:150px}
.vbar>div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-align:center;font-size:12px;font-weight:700}
.vbar i{display:block;border-radius:6px 6px 0 0;min-height:3px}
.feature{display:grid;grid-template-columns:260px minmax(0,1fr)}
.feature .img{position:relative;min-height:200px;background:var(--ink)}
.feature .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.feature .txt{padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:640px){.feature{grid-template-columns:1fr}.feature .img{min-height:160px}.fields2{grid-template-columns:1fr}.thumb{flex-basis:84px;height:70px}}
.article{max-width:680px;display:flex;flex-direction:column;gap:14px}
.article h1{font-size:28px}
.article .body p{font-size:15.5px;line-height:1.7;margin-bottom:14px;color:var(--fg)}
.svc{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left;cursor:pointer;width:100%;color:var(--fg)}
.svc:hover{background:var(--hover)}
.svc[aria-pressed="true"]{border-color:var(--brk);box-shadow:inset 0 0 0 1px var(--brk)}
.svc .ic{flex:0 0 36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--brk-bg);color:var(--brk-fg)}
.daygrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.daygrid button,.slotgrid button{border-radius:8px;cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--fg);font-weight:700}
.daygrid button{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.daygrid small{font-size:10.5px;color:inherit;opacity:.8}
.daygrid b{font-family:var(--display);font-size:17px}
.slotgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slotgrid button{height:34px;font-size:13px}
.daygrid button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.slotgrid button[aria-pressed="true"]{background:var(--soft);color:var(--soft-fg);border-color:var(--primary)}
.stage{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.stage.now{border-color:var(--qq);box-shadow:inset 0 0 0 1px var(--qq)}
.profile-h{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.profile-h .initials{width:56px;height:56px;flex-basis:56px;font-size:20px}
</style>

</head>

function qrPath(seed){
  const n = 25; let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) & 0x7fffffff; let d = '';
  const finder = (x, y) => { for (const [fx, fy] of [[0,0],[n-7,0],[0,n-7]]) { const dx = x-fx, dy = y-fy; if (dx>=-1&&dx<=7&&dy>=-1&&dy<=7){ if(dx<0||dy<0||dx>6||dy>6) return 0; if(dx===0||dy===0||dx===6||dy===6) return 1; return (dx>=2&&dx<=4&&dy>=2&&dy<=4)?1:0; } } return -1; };
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){ let v = finder(x,y); if (v===-1){ s = (s*1103515245+12345) & 0x7fffffff; v = (s>>16)&1; } if (v) d += 'M'+x+' '+y+'h1v1h-1z'; }
  return d;
}

  document.getElementById('app').innerHTML = html;

    if (!t) S.scans.unshift({ name:'Code ' + code, note:'No ticket found', ok:false });
    else if (t.checked) S.scans.unshift({ name:user().name, note:'Already checked in', ok:false });
    else { t.checked = true; S.scans.unshift({ name:user().name, note:`Checked in · ${t.qty} seat${t.qty>1?'s':''}`, ok:true }); logA(`${user().name} checked in at the door`); notify("You're checked in. Live mode is open."); contactTouch('Checked in at ' + ev(t.event).title); }
    render(); },
  note:(f) => { const c = S.contacts.find((x) => x.id===S.ui.crmSel) || S.contacts[0]; c.note = f.note.value; toast('Note saved'); render(); },
  publish:(f) => { const th = f.thread.value; const ch = [['feed','Feed'],['news','The Floor Notes'],['wa','WhatsApp'],['push','Push']].filter(([k]) => f['ch_'+k].checked).map((x) => x[1]);
    if (f.ch_feed.checked) S.posts.unshift({ id:'p'+Date.now(), thread:th, kind:'Update · ' + f.aud.value, title:f.title.value.trim(), body:f.body.value.trim(), route:{TVS:'tvs',BRICKR:'brickr',QuidQuo:'quidquo'}[th] || 'outloud', cta:'Open', when:'Just now' });
    if (f.ch_push.checked) notify(f.title.value.trim());
    S.sent.unshift({ title:f.title.value.trim(), channels:ch.join(', ') || 'None', aud:f.aud.value, when:'Just now' });
    logA('Published: ' + f.title.value.trim()); toast('Published. Switch to the member app to see it.'); render(); },
  edit:(f) => { const ed = S.ui.edit, sc = SCHEMA[ed.s]; const vals = {}; sc.fields.forEach(([k,,t]) => { const el = f.elements[k]; if (!el) return; vals[k] = t==='number' ? (parseInt(el.value,10) || 0) : el.value; });
    if (ed.s==='klass') vals.venue = vals.format==='Online' ? 'Live online' : 'In person · Cairo';
    if (ed.id){ Object.assign(S[sc.coll].find((x) => x.id===ed.id), vals); logA(`Updated ${sc.noun}: ${vals[sc.key]}`); toast('Saved. Changes are live in the member app.'); }
    else { const it = Object.assign({ id: ed.s.slice(0,2) + Date.now() }, sc.defaults, vals); S[sc.coll].unshift(it); logA(`Created ${sc.noun}: ${vals[sc.key]}`); toast(it.status==='Draft' ? 'Created as a draft' : 'Created. It is live in the member app.'); }
    S.ui.edit = null; render(); }
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.ui.notifOpen && !e.target.closest('.notifs')) { S.ui.notifOpen = false; render(); } return; }
  const a = el.dataset.act; if (!act[a]) return;
  if (el.tagName === 'INPUT') { act[a](el.dataset, e); return; }
  if ((a === 'closeov' || a === 'closedrawerbg' || a === 'navclose') && e.target !== el) return;
  if (el.tagName !== 'A') e.preventDefault();
  if (a !== 'notifs' && a !== 'readall') S.ui.notifOpen = false;
  if (el.tagName === 'A') S.ui.navOpen = false;
  act[a](el.dataset, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-act]')) act[e.target.dataset.act](e.target.dataset, e);
  if (e.key === 'Escape'){ if (S.ui.modal) S.ui.modal = null; else if (S.ui.edit) S.ui.edit = null; else if (S.ui.navOpen) S.ui.navOpen = false; else return; render(); }
  if (e.key === 'Enter' && e.target.id === 'gsearch' && !route().startsWith('admin') && !['home','library'].includes(route())) { e.preventDefault(); go('library'); }
});
document.addEventListener('submit', (e) => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); forms[f.dataset.form](f); });
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.input; if (!k) return;
  if (k === 'gsearch'){ S.ui.q = e.target.value; const r = route(); if (['home','library'].includes(r) || r.startsWith('admin')) render(); }
  if (k === 'libq'){ S.ui.libQ = e.target.value; render(); }
  if (k === 'crmq'){ S.ui.crmQ = e.target.value; render(); }
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset && e.target.dataset.change; if (!k) return;
  if (k === 'upload' && e.target.files[0]){ S.classroom.file = e.target.files[0].name; S.classroom.tasks[2] = true; notify('Your map was submitted. Feedback within the week.'); logA(`${user().name} submitted a TVAC task`); render(); }
  if (k === 'evsel'){ S.ui.evSel = e.target.value; render(); }
});
window.addEventListener('hashchange', () => { S.ui.modal = null; S.ui.edit = null; S.ui.navOpen = false; S.ui.notifOpen = false; render(); window.scrollTo(0,0); });
render();
})();
</script>
